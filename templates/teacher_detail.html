{% extends "base.html" %}

{% block title %}{{ teacher.name }} | StX Archive{% endblock %}

{% block content %}
<div class="py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <a href="{{ url_for('teachers') }}" class="inline-flex items-center text-gray-500 hover:text-airred transition-colors text-sm font-medium">
                <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Teachers
            </a>
        </div>

        <div class="bg-white dark:bg-[#1a1a1a] rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-800">
            <div class="w-full h-96 bg-gray-200 dark:bg-gray-700 relative">
                <img src="{{ teacher.image_url }}" alt="{{ teacher.name }}" class="w-full h-full object-cover object-top">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end">
                    <div class="p-8 w-full">
                        <p class="text-airred font-bold uppercase tracking-wider text-sm mb-2">{{ teacher.subject }}</p>
                        <h1 class="text-4xl font-extrabold text-white tracking-tight">{{ teacher.name }}</h1>
                    </div>
                </div>
            </div>
            
            <div class="p-8 md:p-12 text-gray-800 dark:text-gray-200 leading-relaxed text-base prose dark:prose-invert max-w-none">
                {{ teacher.description | safe }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
