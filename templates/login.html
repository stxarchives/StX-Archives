{% extends 'base.html' %}

{% block title %}Login | StX Archive{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 mb-24">
    <div class="text-center mb-10">
        <h2 class="text-4xl font-black text-airblack dark:text-white tracking-tighter">Welcome Back</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-3 font-medium">Log in to post your experiences.</p>
    </div>

    <div class="bg-white dark:bg-[#151515] rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
        <div class="px-10 pt-10 pb-8">
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-6">
                    <label for="email" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>
                
                <div class="mb-8">
                    <label for="password" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>
                
                <div class="flex items-center mb-6">
                    <input type="checkbox" id="remember_me" name="remember_me" class="w-4 h-4 text-airred border-gray-300 rounded focus:ring-airred dark:border-gray-700 dark:bg-[#111]">
                    <label for="remember_me" class="ml-2 text-sm font-medium text-gray-600 dark:text-gray-400 cursor-pointer">Remember me for 30 days</label>
                </div>
                
                <button type="submit" class="w-full bg-airred hover:bg-airdarkred text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-airred/30 transition-all uppercase tracking-wider text-sm mb-4">
                    Log In
                </button>
                <button type="button" onclick="playPrank()" class="w-full bg-gray-800 hover:bg-gray-900 dark:bg-[#222] dark:hover:bg-[#333] border border-transparent dark:border-gray-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all uppercase tracking-wider text-sm">
                    Login as Admin
                </button>
            </form>
        </div>
        <div class="bg-gray-50 dark:bg-[#111] px-10 py-5 border-t border-gray-100 dark:border-gray-800 text-center flex flex-col gap-3">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
                Don't have an account? <a href="{{ url_for('signup') }}" class="text-airred hover:text-airdarkred font-bold transition-colors">Sign up here</a>
            </p>
        </div>
    </div>
</div>

<!-- Prank Audio (Hidden) -->
<audio id="prankAudio" src="{{ url_for('static', filename='music/prank.mp3') }}" preload="auto" loop></audio>

<script>
    let isPrankActive = false;

    function playPrank() {
        isPrankActive = true;

        function lockFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log('Fullscreen blocked:', e));
            }
        }
        
        lockFullscreen();

        // Aggressively trap them in fullscreen on any interaction
        document.addEventListener('fullscreenchange', () => {
            if (isPrankActive && !document.fullscreenElement) {
                lockFullscreen();
            }
        });

        // If fullscreen is blocked on exit, any mouse movement, click, or keypress forces it back
        ['click', 'mousemove', 'keydown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                if (isPrankActive && !document.fullscreenElement) {
                    lockFullscreen();
                }
            });
        });

        try {
            const audio = document.getElementById('prankAudio');
            audio.volume = 1.0; // Max out browser tab volume
            audio.loop = true;
            audio.currentTime = 0;
            audio.play().catch(e => {
                console.log('Audio playback failed:', e);
                // Fallback for strict browsers
                const newAudio = new Audio("{{ url_for('static', filename='music/prank.mp3') }}");
                newAudio.volume = 1.0;
                newAudio.loop = true;
                newAudio.play();
            });
        } catch (err) {
            console.error(err);
        }
    }
</script>
{% endblock %}
