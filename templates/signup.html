{% extends 'base.html' %}

{% block title %}Sign Up | StX Archive{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 mb-24">
    <div class="text-center mb-10">
        <h2 class="text-4xl font-black text-airblack dark:text-white tracking-tighter">Join the Archive</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-3 font-medium">Create an account to share your experiences.</p>
    </div>

    <div class="bg-white dark:bg-[#151515] rounded-3xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
        <div class="px-10 pt-10 pb-8">
            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-6">
                    <label for="username" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Username</label>
                    <input type="text" id="username" name="username" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>

                <div class="mb-6">
                    <label for="email" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Password</label>
                    <input type="password" id="password" name="password" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>
                
                <div class="mb-8">
                    <label for="confirm_password" class="block text-xs font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required class="w-full px-5 py-4 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#111] text-gray-900 dark:text-white focus:ring-2 focus:ring-airred focus:border-airred transition-all font-medium">
                </div>
                
                <button type="submit" class="w-full bg-airred hover:bg-airdarkred text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-airred/30 transition-all uppercase tracking-wider text-sm">
                    Create Account
                </button>
            </form>
        </div>
        <div class="bg-gray-50 dark:bg-[#111] px-10 py-5 border-t border-gray-100 dark:border-gray-800 text-center">
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
                Already have an account? <a href="{{ url_for('login') }}" class="text-airred hover:text-airdarkred font-bold transition-colors">Log in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
